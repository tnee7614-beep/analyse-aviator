<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyber Rose Scanner - Bet261 Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; color: #111827; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .score-box { background-color: #374151; color: #ffffff; font-weight: 700; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <div class="w-full max-w-md bg-white border-b border-slate-200 p-3 flex items-center justify-between sticky top-0 z-50 shadow-sm">
        <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        <div class="flex items-center space-x-2 bg-yellow-100 px-3 py-1 rounded-full text-sm font-semibold">
            <span class="text-yellow-600">🪙</span>
            <span>0 MGA</span>
        </div>
        <svg class="w-7 h-7 text-gray-800" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path></svg>
    </div>

    <div class="w-full max-w-md bg-white p-4 flex-grow mb-16">
        <div class="flex items-center border-b border-slate-200 mb-4">
            <div class="w-1/3 text-center pb-2 border-b-2 border-lime-500 font-semibold text-lime-600">Résultats</div>
            <div class="w-1/3 text-center pb-2 text-gray-500 font-medium">Matchs</div>
            <div class="w-1/3 text-center pb-2 text-gray-500 font-medium">Classement</div>
        </div>

        <label class="block w-full bg-gradient-to-r from-lime-600 to-green-700 hover:from-lime-500 hover:to-green-600 text-white font-bold py-3 px-4 rounded-xl text-center cursor-pointer shadow-lg transition-all mb-4">
            📸 Tsindrio eto raha haka sary / Analyser
            <input type="file" id="imageInput" accept="image/*" class="hidden">
        </label>

        <div class="text-center text-xs font-semibold text-gray-500 mb-4 bg-gray-100 py-1.5 rounded-lg uppercase tracking-wide">
            Journée 13 - Aujourd'hui 08:51
        </div>

        <div id="resultContainer" class="space-y-3">
            <div class="border-b border-slate-100 pb-3">
                <div class="grid grid-cols-[1fr,auto,1fr] items-center gap-2">
                    <div class="text-right font-semibold text-sm">Sunderland <span class="text-[10px] font-normal block text-gray-400">81'</span></div>
                    <div class="score-box text-sm px-3 py-1 rounded text-center">1:1<span class="block text-[9px] font-normal text-gray-300">MT: 0:1</span></div>
                    <div class="text-left font-semibold text-sm">Manchester Red <span class="text-[10px] font-normal block text-gray-400">11'</span></div>
                </div>
            </div>
            <div class="border-b border-slate-100 pb-3">
                <div class="grid grid-cols-[1fr,auto,1fr] items-center gap-2">
                    <div class="text-right font-semibold text-sm">London Reds <span class="text-[10px] font-normal block text-gray-400">54'</span></div>
                    <div class="score-box text-sm px-3 py-1 rounded text-center">1:0<span class="block text-[9px] font-normal text-gray-300">MT: 0:0</span></div>
                    <div class="text-left font-semibold text-sm">Burnley</div>
                </div>
            </div>
            <div class="border-b border-slate-100 pb-3">
                <div class="grid grid-cols-[1fr,auto,1fr] items-center gap-2">
                    <div class="text-right font-semibold text-sm">Liverpool <span class="text-[10px] font-normal block text-gray-400">21' 34' 80'</span></div>
                    <div class="score-box text-sm px-3 py-1 rounded text-center">3:0<span class="block text-[9px] font-normal text-gray-300">MT: 2:0</span></div>
                    <div class="text-left font-semibold text-sm">Leeds</div>
                </div>
            </div>
            <div class="border-b border-slate-100 pb-3">
                <div class="grid grid-cols-[1fr,auto,1fr] items-center gap-2">
                    <div class="text-right font-semibold text-sm">Spurs <span class="text-[10px] font-normal block text-gray-400">4' 8' 89'</span></div>
                    <div class="score-box text-sm px-3 py-1 rounded text-center">3:2<span class="block text-[9px] font-normal text-gray-300">MT: 2:0</span></div>
                    <div class="text-left font-semibold text-sm">Bournemouth <span class="text-[10px] font-normal block text-gray-400">60' 73'</span></div>
                </div>
            </div>
        </div>
    </div>

    <div class="w-full max-w-md bg-white border-t border-slate-200 p-2.5 flex justify-around text-[10px] text-gray-600 font-medium fixed bottom-0 shadow-lg">
        <div class="flex flex-col items-center">Menu</div>
        <div class="flex flex-col items-center text-lime-600 font-bold">Virtuel</div>
        <div class="flex flex-col items-center">Mes paris</div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const resultContainer = document.getElementById('resultContainer');

        const alternativeResults = [
            `
            <div class="border-b border-slate-100 pb-3"><div class="grid grid-cols-[1fr,auto,1fr] items-center gap-2"><div class="text-right font-semibold text-sm">London Blues <span class="text-[10px] font-normal block text-gray-400">17' 71'</span></div><div class="score-box text-sm px-3 py-1 rounded text-center">2:1<span class="block text-[9px] font-normal text-gray-300">MT: 1:0</span></div><div class="text-left font-semibold text-sm">Fulham <span class="text-[10px] font-normal block text-gray-400">62'</span></div></div></div>
            <div class="border-b border-slate-100 pb-3"><div class="grid grid-cols-[1fr,auto,1fr] items-center gap-2"><div class="text-right font-semibold text-sm">C. Palace <span class="text-[10px] font-normal block text-gray-400">8' 43' 50'</span></div><div class="score-box text-sm px-3 py-1 rounded text-center">3:0<span class="block text-[9px] font-normal text-gray-300">MT: 2:0</span></div><div class="text-left font-semibold text-sm">N. Forest</div></div></div>
            <div class="border-b border-slate-100 pb-3"><div class="grid grid-cols-[1fr,auto,1fr] items-center gap-2"><div class="text-right font-semibold text-sm">West Ham</div><div class="score-box text-sm px-3 py-1 rounded text-center">0:0<span class="block text-[9px] font-normal text-gray-300">MT: 0:0</span></div><div class="text-left font-semibold text-sm">Brentford</div></div></div>
            `,
            `
            <div class="border-b border-slate-100 pb-3"><div class="grid grid-cols-[1fr,auto,1fr] items-center gap-2"><div class="text-right font-semibold text-sm">Manchester Blue <span class="text-[10px] font-normal block text-gray-400">68'</span></div><div class="score-box text-sm px-3 py-1 rounded text-center">1:0<span class="block text-[9px] font-normal text-gray-300">MT: 0:0</span></div><div class="text-left font-semibold text-sm">Everton</div></div></div>
            <div class="border-b border-slate-100 pb-3"><div class="grid grid-cols-[1fr,auto,1fr] items-center gap-2"><div class="text-right font-semibold text-sm">Wolverhampton <span class="text-[10px] font-normal block text-gray-400">41' 71' 87'</span></div><div class="score-box text-sm px-3 py-1 rounded text-center">3:2<span class="block text-[9px] font-normal text-gray-300">MT: 1:1</span></div><div class="text-left font-semibold text-sm">A. Villa <span class="text-[10px] font-normal block text-gray-400">10' 89'</span></div></div></div>
            <div class="border-b border-slate-100 pb-3"><div class="grid grid-cols-[1fr,auto,1fr] items-center gap-2"><div class="text-right font-semibold text-sm">Brighton <span class="text-[10px] font-normal block text-gray-400">19' 46' 69' 90'</span></div><div class="score-box text-sm px-3 py-1 rounded text-center">4:2<span class="block text-[9px] font-normal text-gray-300">MT: 1:2</span></div><div class="text-left font-semibold text-sm">Newcastle <span class="text-[10px] font-normal block text-gray-400">1' 35'</span></div></div></div>
            `
        ];

        imageInput.addEventListener('change', function(e) {
            if(e.target.files.length > 0) {
                const randomIndex = Math.floor(Math.random() * alternativeResults.length);
                resultContainer.innerHTML = alternativeResults[randomIndex];
                imageInput.value = '';
            }
        });
    </script>
</body>
</html>
