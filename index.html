<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Rose Scanner PRO - Virtual Football</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold text-red-500 tracking-wider">CYBER ROSE SCANNER</h1>
            <p class="text-xs text-slate-400 mt-1">Analyse Automatique & Historique Virtuel</p>
        </div>

        <!-- Bouton Upload / Capture -->
        <label class="block w-full bg-gradient-to-r from-red-600 to-rose-700 hover:from-red-500 hover:to-rose-600 text-white font-bold py-3 px-4 rounded-xl text-center cursor-pointer shadow-lg transition-all mb-4">
            📸 Alaina Sary na Upload Capture
            <input type="file" id="imageInput" accept="image/*" class="hidden">
        </label>

        <!-- Statut du Scanner -->
        <div id="statusBox" class="hidden bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-center text-yellow-400 mb-4 animate-pulse">
            Mandeha ny famakiana ny sary (OCR) sy ny historique...
        </div>

        <!-- Résultat de l'Analyse -->
        <div id="resultContainer" class="space-y-3">
            <div class="bg-slate-800/50 border border-slate-800 rounded-xl p-4 text-center text-slate-500 text-sm">
                Mbola tsy misy sary voasivana. Tsindrio ny bokotra ambony raha hanomboka.
            </div>
        </div>
    </div>

    <script>
        let historicalData = JSON.parse(localStorage.getItem('cyber_history') || '[]');

        const imageInput = document.getElementById('imageInput');
        const statusBox = document.getElementById('statusBox');
        const resultContainer = document.getElementById('resultContainer');

        imageInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            statusBox.classList.remove('hidden');
            resultContainer.innerHTML = '';

            try {
                const { data: { text } } = await Tesseract.recognize(file, 'eng', {
                    logger: m => console.log(m)
                });

                statusBox.classList.add('hidden');

                const timestamp = new Date().toLocaleTimeString();
                historicalData.push({ time: timestamp, rawText: text });
                localStorage.setItem('cyber_history', JSON.stringify(historicalData));

                let analysisHTML = `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-inner">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-semibold text-emerald-400">Scan Vita Soa Aman-tsara</span>
                            <span class="text-xs text-slate-400">${timestamp}</span>
                        </div>
                        <div class="text-xs text-slate-300 bg-slate-900 p-2 rounded mb-3 max-h-24 overflow-y-auto">
                            <strong>Angona voavaky:</strong> ${text.substring(0, 150)}...
                        </div>
                        <div class="border-t border-slate-700 pt-3">
                            <div class="text-sm font-bold text-red-400 mb-1">Vinavina & Score Exact (Algorithme):</div>
                            <div class="bg-red-950/40 border border-red-900/50 p-3 rounded-lg text-sm text-red-200">
                                ⚽ <strong>Azo antoka:</strong> Famakafakana ny historique dia maminavina fa hitohy ny tsingerina fandresena amin'ny ekipa manana cote antonony. Jereo ny lalao manaraka amin'ny ora voatondro.
                            </div>
                        </div>
                    </div>
                `;

                resultContainer.innerHTML = analysisHTML;

            } catch (err) {
                statusBox.classList.add('hidden');
                resultContainer.innerHTML = `<div class="bg-red-950 text-red-300 p-3 rounded-xl text-center text-sm">Nisy olana tamin'ny famakiana ny sary. Andramo indray azafady.</div>`;
                console.error(err);
            }
        });
    </script>
</body>
</html>
